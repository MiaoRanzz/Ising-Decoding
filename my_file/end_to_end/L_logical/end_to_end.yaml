# Default settings for the labeled end-to-end workflow.
#
# Paths are relative to the repository root.  Set `checkpoint` before running
# the comparison command.  Command-line options remain available as temporary
# overrides, e.g. `--num-samples 4096`.

generation:
  output_dir: my_file/end_to_end/L_logical/data_generated/dataset_Xd9c9_1
  project_config: conf/config_public.yaml
  # Null means inherit from project_config.
  distance: 9
  n_rounds: 9
  code_rotation: O1
  basis: X
  num_samples: 262144
  batch_size: 1024
  seed: 12345
  device: null
  simple_noise: false
  p_error: 0.003

comparison:
  dataset_dir: my_file/end_to_end/L_logical/data_generated/dataset_Xd9c9_1
  project_config: conf/config_public.yaml
  # Set this to the checkpoint you want to test.
  checkpoint: outputs/test1/models/PreDecoderModelMemory_v1.0.100.pt
  output: my_file/end_to_end/L_logical/comparison_results/comparison_Xd9c9_1.json
  # This checkpoint is PreDecoderModelMemory_v1, i.e. Ising-fast model 1.
  model_id: 1
  batch_size: 1024
  device: null

# Offline whole-shot safe-no-op validation. This task consumes the per-shot
# artifact already produced by comparison, but owns every path it needs.
# The threshold is selected on a deterministic validation split, then reported
# once on the held-out split.
safe_no_op:
  dataset_dir: my_file/end_to_end/L_logical/data_generated/dataset_Xd9c9_1
  project_config: conf/config_public.yaml
  checkpoint: outputs/test1/models/PreDecoderModelMemory_v1.0.100.pt
  model_id: 1
  batch_size: 1024
  device: null
  per_shot_file: my_file/end_to_end/L_logical/comparison_results/comparison_Xd9c9_1.per_shot.npz
  confidence_output: my_file/end_to_end/L_logical/comparison_results/comparison_Xd9c9_1.confidence.npz
  output: my_file/end_to_end/L_logical/comparison_results/comparison_Xd9c9_1.safe_no_op.json
  score: positive_margin_q10  
  # positive_margin_q10: the 10th percentile of positive margins
  # positive_margin_mean: the mean of positive margins
  # positive_margin_min: the minimum of positive margins
  # action_count: the number of actions taken
  # data_action_count: the number of data actions taken
  # syndrome_action_count: the number of syndrome actions taken
  num_confidence_bins: 10
  num_thresholds: 101
  validation_fraction: 0.5
  split_seed: 12345

# Packet-level safe-no-op workflow. It freezes the proposal
# checkpoint configured in this section. Changing that checkpoint requires a
# new local-risk dataset, regardless of any other task's configuration.
packet_risk_generation:
  source_dataset_dir: my_file/end_to_end/L_logical/data_generated/dataset_Xd9c9_1
  project_config: conf/config_public.yaml
  checkpoint: outputs/test1/models/PreDecoderModelMemory_v1.0.100.pt
  model_id: 1
  output_dir: my_file/end_to_end/L_logical/packet_model/data/dataset_Xd9c9_1_model_100
  # Null means annotate every source shot.  Start with 4096 to smoke-test.
  num_samples: null
  proposal_batch_size: 256
  # This controls repeated endpoint decoder calls, so lower it if GPU memory is tight.
  counterfactual_batch_size: 1024
  seed: 12345
  device: null

packet_gate_training:
  risk_dataset_dir: my_file/end_to_end/L_logical/packet_model/data/dataset_Xd9c9_1_model_100
  output_dir: my_file/end_to_end/L_logical/packet_model/models/dataset_Xd9c9_1_model_100
  batch_size: 128
  epochs: 100
  learning_rate: 0.0001
  # Cosine decay is applied once per epoch, from learning_rate to this value.
  # Set lr_scheduler: none to use a fixed learning rate.
  lr_scheduler: cosine
  min_learning_rate: 0.00001
  weight_decay: 0.00001
  # The third, implicit remainder is an untouched final test split.
  train_fraction: 0.70
  validation_fraction: 0.15
  split_seed: 12345
  # Keep every helpful/harmful packet in BCE, but retain only this many neutral
  # packet positions per informative packet (on average) each training epoch.
  neutral_per_informative: 10
  # Applied after neutral downsampling, not against the full neutral count.
  max_positive_weight: 100.0
  # Evaluate these saved candidates by endpoint LER in the separate evaluation task.
  checkpoint_interval_epochs: 1
  num_workers: 0
  # Print batch-level loss/ETA every N training batches.
  log_every_batches: 256
  device: null
  architecture:
    input_channels: 12
    hidden_channels: 64
    num_hidden_layers: 3
    kernel_size: 3
    dropout: 0.05

packet_gate_evaluation:
  risk_dataset_dir: my_file/end_to_end/L_logical/packet_model/data/dataset_Xd9c9_1_model_100
  checkpoint_dir: my_file/end_to_end/L_logical/packet_model/models/dataset_Xd9c9_1_model_100
  checkpoint_glob: epoch_*.pt
  output: my_file/end_to_end/L_logical/packet_model/models/dataset_Xd9c9_1_model_100/endpoint_selected_ler.json
  batch_size: 256
  # Must match local_gate_training. The unallocated remainder is test-only.
  train_fraction: 0.70
  validation_fraction: 0.15
  split_seed: 12345
  # Gate thresholds are validation-logit quantiles, plus accept-all/no-op endpoints.
  num_thresholds: 21
  device: null

# Group-level safe-no-op workflow.  It uses a fixed connected-component
# grouping of active packets, then learns one accept/no-op decision per group.
# It is independent from all packet_* entries above.
group_risk_generation:
  source_dataset_dir: my_file/end_to_end/L_logical/data_generated/dataset_Xd9c9_1
  project_config: conf/config_public.yaml
  checkpoint: outputs/test1/models/PreDecoderModelMemory_v1.0.100.pt
  model_id: 1
  output_dir: my_file/end_to_end/L_logical/group_model/data/dataset_Xd9c9_1_model_100
  num_samples: null
  proposal_batch_size: 256
  counterfactual_batch_size: 1024
  seed: 12345
  device: null
  grouping:
    # Packets with |dt| <= 1 and Manhattan spatial distance <= 1 connect.
    time_radius: 1
    spatial_radius: 1
    # Deterministically split large components to keep counterfactual groups local.
    max_group_members: 8
    max_time_span: 3
    max_spatial_span: 3

group_gate_training:
  risk_dataset_dir: my_file/end_to_end/L_logical/group_model/data/dataset_Xd9c9_1_model_100
  # Separate from old binary helpful-acceptance / harmful-veto checkpoints.
  output_dir: my_file/end_to_end/L_logical/group_model/models/dataset_Xd9c9_1_model_100_harmful_helpful_margin
  batch_size: 128
  epochs: 100
  learning_rate: 0.0001
  lr_scheduler: cosine
  min_learning_rate: 0.00001
  weight_decay: 0.00001
  train_fraction: 0.70
  validation_fraction: 0.15
  split_seed: 12345
  neutral_per_informative: 100
  max_positive_weight: 100.0
  num_workers: 0
  # Only about a dozen sampled train batches are expected per epoch, so emit
  # a live line for each batch.
  log_every_batches: 64
  device: null
  architecture:
    input_channels: 12
    hidden_channels: 64
    num_hidden_layers: 3
    kernel_size: 3
    dropout: 0.05
    group_hidden_channels: 128
    num_risk_classes: 3

group_gate_evaluation:
  risk_dataset_dir: my_file/end_to_end/L_logical/group_model/data/dataset_Xd9c9_1_model_100
  checkpoint_dir: my_file/end_to_end/L_logical/group_model/models/dataset_Xd9c9_1_model_100_harmful_helpful_margin
  checkpoint_glob: epoch_*.pt
  output: my_file/end_to_end/L_logical/group_model/models/dataset_Xd9c9_1_model_100_harmful_helpful_margin/endpoint_selected_ler.json
  batch_size: 256
  train_fraction: 0.70
  validation_fraction: 0.15
  split_seed: 12345
  num_thresholds: 21
  # A high score means a harmful correction group.  The learned veto path may
  # remove at most this fraction; the evaluator also tests all-no-op fallback.
  max_veto_coverage: 0.05
  # Use full validation for model selection: 8,192 shots produced only nine
  # logical failures and was too noisy across checkpoint/threshold search.
  max_validation_shots: null
  max_test_shots: null
  # Emit one progress line every N gate-score or endpoint-decoder batches.
  progress_every_batches: 8
  device: null

# One final held-out test for a checkpoint/threshold already selected on
# validation.  This task never scans alternatives.
group_gate_fixed_test:
  risk_dataset_dir: my_file/end_to_end/L_logical/group_model/data/dataset_Xd9c9_1_model_100
  ising_fast_checkpoint: outputs/test1/models/PreDecoderModelMemory_v1.0.100.pt
  # Fill these from group_gate_evaluation after the new three-class run.
  gate_checkpoint: null
  veto_threshold: null
  output: my_file/end_to_end/L_logical/group_model/models/dataset_Xd9c9_1_model_100_harmful_helpful_margin/fixed_test.json
  batch_size: 256
  train_fraction: 0.70
  validation_fraction: 0.15
  split_seed: 12345
  progress_every_batches: 8
  device: null
