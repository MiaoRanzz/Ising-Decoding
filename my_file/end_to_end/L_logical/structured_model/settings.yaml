# Standalone configuration for integrated structured-action safe no-op training.
structured_model:
  # offline: reuse one fixed labeled corpus (fast experiments).
  # strict: sample fresh shots every epoch and a separate fresh inference set.
  data_mode: offline
  # Used only when data_mode: offline.
  dataset_dir: my_file/end_to_end/L_logical/data_generated/dataset_Xd9c9_1
  project_config: conf/config_public.yaml
  base_checkpoint: outputs/test1/models/PreDecoderModelMemory_v1.0.100.pt
  model_id: 1

# Used only when structured_model.data_mode: strict. Generation parameters are
# inherited from reference_config unless explicitly overridden below. The three
# batch plans match the original NVIDIA d9 configuration. Strict mode uses
# exactly num_batches * batch_size fresh shots for each stream.
structured_strict_data:
  # Supplies NVIDIA d9 sample counts and HE/generator settings only.
  reference_config: conf/config_pre_decoder_memory_surface_model_1_d9.yaml
  # Supplies the actual circuit error probabilities. This must match the
  # noise distribution used to train the configured Ising-fast checkpoint.
  noise_config: conf/config_public.yaml
  distance: 9
  n_rounds: 9
  measure_basis: both
  code_rotation: XV
  # These are the strict train/evaluation workload controls. Change both the
  # number of generator calls and the number of shots returned by each call.
  train_num_batches: 256
  train_batch_size: 1024
  validation_num_batches: 64
  validation_batch_size: 1024
  test_num_batches: 256
  test_batch_size: 256
  # null gives every invocation a fresh session seed. As in the original
  # trainer, stream-specific offsets are applied once and batches do not reseed.
  # The selected session seed is saved in checkpoints/reports.
  session_seed: null
  # null builds the DEM bundle in memory and avoids machine-specific paths from
  # the reference YAML. Set a valid directory to reuse precomputed frames.
  precomputed_frames_dir: null
  verbose_generator: true

# Change only this section to advance the workflow. All scripts read this one
# YAML file and deliberately accept no command-line configuration switches.
structured_training:
  # First run with oracle. After generate_endpoint_teacher.py finishes, set
  # phase: teacher.
  phase: oracle

structured_oracle_training:
  output_dir: my_file/end_to_end/L_logical/structured_model/models/oracle_exp2
  strict_output_dir: my_file/end_to_end/L_logical/structured_model/models/strict_oracle_exp2
  epochs: 5
  batch_size: 128             # offline only; strict uses structured_strict_data
  learning_rate: 0.0001
  # Print live training/validation progress every N batches.
  log_every_batches: 25
  weight_decay: 0.00001
  train_fraction: 0.70       # offline only
  validation_fraction: 0.15 # offline only
  split_seed: 12345          # offline only
  num_workers: 0             # offline only
  device: null

structured_teacher_generation:
  # checkpoint/output_dir/num_samples/proposal_batch_size/seed are offline
  # only. In strict mode teacher actions are generated inside each train/val
  # batch from structured_teacher_training.resume_checkpoint.
  checkpoint: my_file/end_to_end/L_logical/structured_model/models/oracle_exp2/best.pt
  output_dir: my_file/end_to_end/L_logical/structured_model/data/teacher_round_1_exp2
  # Start with 4096; null generates a teacher for the whole corpus.
  num_samples: null
  seed: 12345
  proposal_batch_size: 128
  endpoint_batch_size: 512
  max_groups_per_shot: 3
  include_pairs: true
  include_all_no_op: true
  logical_failure_weight: 1000.0
  residual_weight: 1.0
  action_weight: 0.01
  grouping:
    time_radius: 1
    spatial_radius: 1
    max_group_members: 8
    max_time_span: 3
    max_spatial_span: 3
  device: null

structured_teacher_training:
  teacher_dataset_dir: my_file/end_to_end/L_logical/structured_model/data/teacher_round_1_exp2 # offline only
  # Usually the oracle (or prior teacher round) model selected on validation.
  resume_checkpoint: my_file/end_to_end/L_logical/structured_model/models/oracle_exp2/best.pt
  strict_resume_checkpoint: my_file/end_to_end/L_logical/structured_model/models/strict_oracle_exp2/best.pt
  output_dir: my_file/end_to_end/L_logical/structured_model/models/teacher_round_1_exp2
  strict_output_dir: my_file/end_to_end/L_logical/structured_model/models/strict_teacher_round_1_exp2
  epochs: 5
  batch_size: 128             # offline only; strict uses structured_strict_data
  learning_rate: 0.00003
  # Print live training/validation progress every N batches.
  log_every_batches: 25
  weight_decay: 0.00001
  endpoint_weight: 0.25
  train_fraction: 0.70       # offline only
  validation_fraction: 0.15 # offline only
  split_seed: 12345          # offline only
  num_workers: 0             # offline only
  device: null

structured_evaluation:
  # Use warm_start_audit before retraining after a conversion change. It loads
  # no structured checkpoints. Change to full after new oracle/teacher models
  # have been trained with the fixed code.
  mode: full
  audit_output: my_file/end_to_end/L_logical/structured_model/models/warm_start_audit.json
  # All four paths below are tested on the same held-out split.
  checkpoint: my_file/end_to_end/L_logical/structured_model/models/teacher_round_1_exp2/best.pt
  oracle_checkpoint: my_file/end_to_end/L_logical/structured_model/models/oracle_exp2/best.pt
  output: my_file/end_to_end/L_logical/structured_model/models/teacher_round_1_exp2/endpoint_selected_ler.json
  # Strict-only counterparts keep strict and offline artifacts separate.
  strict_checkpoint: my_file/end_to_end/L_logical/structured_model/models/strict_teacher_round_1_exp2/best.pt
  strict_oracle_checkpoint: my_file/end_to_end/L_logical/structured_model/models/strict_oracle_exp2/best.pt
  strict_output: my_file/end_to_end/L_logical/structured_model/models/strict_teacher_round_1_exp2/endpoint_selected_ler.json
  batch_size: 256             # offline only; strict uses structured_strict_data
  log_every_batches: 25
  train_fraction: 0.70       # offline only
  validation_fraction: 0.15 # offline only
  split_seed: 12345          # offline only
  # Positive values make no-op more likely. Select only on validation.
  no_op_biases: [-0.5, -0.25, 0.0, 0.25, 0.5, 0.75, 1.0]
  device: null
